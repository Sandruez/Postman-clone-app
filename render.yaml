databases:
  - name: postman-clone-db
    plan: free
    databaseName: postman_clone
    user: postman_user

services:
  # --- Backend: FastAPI Proxy & Persistence ---
  - type: web
    name: postman-clone-api-cp
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://postman-clone-app-cp.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: postman-clone-db
          property: connectionString
    autoDeploy: true

  # --- Frontend: Next.js App ---
  - type: web
    name: postman-clone-app-cp
    runtime: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://postman-clone-api-cp.onrender.com/api"
      - key: NODE_VERSION
        value: "20"
    autoDeploy: true
